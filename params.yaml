data_source:
  type: synthetic  # "synthetic" or "cwru"

generate:
  seed: 42
  n_samples: 200
  signal_length: 2048

preprocess:
  window_size: 128
  stride: 64
  val_split: 0.15
  test_split: 0.15

validate:
  min_per_class: 10
  drift_threshold: 0.05

train:
  lr: 0.001
  epochs: 50
  batch_size: 64
  patience: 5

model:
  arch: cnn
  hidden_dim: 256
  n_classes: 4
  cnn:
    channels:
      - 32
      - 64
    kernel_size: 7
    pool_size: 2
    fc_hidden: 128
    dropout: 0.3