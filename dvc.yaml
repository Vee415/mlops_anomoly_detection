stages:
  generate:
    cmd: python src/generate_synthetic.py --output data/raw
    deps:
      - src/generate_synthetic.py
    outs:
      - data/raw/signals.npy
      - data/raw/labels.npy
    params:
      - generate.seed

  preprocess:
    cmd: python src/preprocess.py --input data/raw --output data/processed
    deps:
      - src/preprocess.py
      - data/raw/signals.npy
      - data/raw/labels.npy
    outs:
      - data/processed/train_features.npy
      - data/processed/train_labels.npy
      - data/processed/val_features.npy
      - data/processed/val_labels.npy
      - data/processed/test_features.npy
      - data/processed/test_labels.npy
      - data/processed/norm_mean.npy
      - data/processed/norm_std.npy
    params:
      - preprocess.window_size
      - preprocess.stride
      - preprocess.val_split
      - preprocess.test_split

  train:
    cmd: python src/train.py
    deps:
      - src/train.py
      - src/model.py
      - data/processed/train_features.npy
      - data/processed/train_labels.npy
      - data/processed/val_features.npy
      - data/processed/val_labels.npy
    params:
      - train.lr
      - train.epochs
      - train.batch_size
      - train.patience
      - model.hidden_dim
      - model.n_classes
    outs:
      - models/model.pth
    metrics:
      - reports/metrics.json:
          cache: false

  evaluate:
    cmd: python src/evaluate.py
    deps:
      - src/evaluate.py
      - models/model.pth
      - data/processed/test_features.npy
      - data/processed/test_labels.npy
    outs:
      - reports/evaluation_report.md:
          cache: false